name: Build ArlightTetris Skin Image Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-arlighttetris.yml"
      - "portraitfix/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-arlighttetris.yml"
      - "portraitfix/**"
      - "build-trigger.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile portrait hotfix
        working-directory: portraitfix
        run: gradle --no-daemon clean build

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          JAR=$(find portraitfix/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$JAR"
          cp "$JAR" artifact/ArlightTetris-0.6.18-SKIN-IMAGE-HOTFIX.jar
          ls -lh artifact

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.6.18-SKIN-IMAGE-HOTFIX
          path: artifact/ArlightTetris-0.6.18-SKIN-IMAGE-HOTFIX.jar
          if-no-files-found: error
          retention-days: 30
