name: Build ArlightTetris 0.7.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Rebuild source
        run: |
          wc -c phase1/source.part*
          cat phase1/source.part* > joined.b64
          wc -c joined.b64
          sha256sum joined.b64
          base64 -d joined.b64 > source.zip
          mkdir project
          unzip -q source.zip -d project
          if [ -d phase1/overrides ]; then cp -a phase1/overrides/. project/; fi
          test -f project/build.gradle
          grep -q "version = '0.7.0'" project/build.gradle

      - name: Compile
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          JAR=$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$JAR"
          cp "$JAR" artifact/ArlightTetris-0.7.0-GAMEPLAY-PHASE1-COMPILED.jar
          ls -lh artifact

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.7.0-GAMEPLAY-PHASE1
          path: artifact/ArlightTetris-0.7.0-GAMEPLAY-PHASE1-COMPILED.jar
          if-no-files-found: error
          retention-days: 30
