name: Build ArlightTetris 0.10.0 Portrait Fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-arlighttetris-0.10.0.yml"
      - "build-trigger-arlighttetris-0.10.0.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Download patched ArlightTetris source
        shell: bash
        run: |
          curl -L --fail --retry 4 --retry-delay 3 \
            -o arlighttetris-source.zip \
            "https://drive.usercontent.google.com/download?id=1RosCaQibqH6xPVrzolf2TX4q27-54jOd&export=download&confirm=t"
          unzip -t arlighttetris-source.zip
          mkdir -p arlighttetris-project
          unzip -q arlighttetris-source.zip -d arlighttetris-project

      - name: Compile NeoForge mod
        working-directory: arlighttetris-project
        run: gradle --no-daemon clean build

      - name: Prepare final JAR
        shell: bash
        run: |
          mkdir -p dist
          JAR="$(find arlighttetris-project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" "dist/ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS-PORTRAITFIX.jar"
          ls -lh dist

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS-PORTRAITFIX
          path: dist/ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS-PORTRAITFIX.jar
          if-no-files-found: error
          retention-days: 7
