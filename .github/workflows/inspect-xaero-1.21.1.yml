name: Inspect Xaero Minimap 1.21.1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official Xaero jar
        run: |
          curl -L --fail --retry 4 -o xaero.jar 'https://cdn.modrinth.com/data/1bokaNcj/versions/CatMvRfN/xaerominimap-neoforge-1.21.1-25.3.10.jar'
          unzip -t xaero.jar >/dev/null
      - name: Inspect exact client suppression API
        shell: bash
        run: |
          echo '===== MINIMAP PROCESSOR MEMBERS ====='
          javap -classpath xaero.jar -p xaero.common.minimap.MinimapProcessor | grep -i -C 8 'noMinimap' || true
          echo '===== MINIMAP PROCESSOR FIELD USAGE ====='
          javap -classpath xaero.jar -p -c xaero.common.minimap.MinimapProcessor > processor.txt
          grep -n -C 35 'noMinimapMessageReceived' processor.txt || true
          echo '===== CLIENT CONFIG MANAGER ====='
          javap -classpath xaero.jar -p xaero.lib.client.config.ClientConfigManager || true
          echo '===== BOOLEAN CONFIG OPTION ====='
          javap -classpath xaero.jar -p xaero.lib.common.config.option.BooleanConfigOption || true
          echo '===== CONFIG OPTION ====='
          javap -classpath xaero.jar -p xaero.lib.common.config.option.ConfigOption || true
          echo '===== HUD MODULE ====='
          javap -classpath xaero.jar -p -c xaero.hud.module.HudModule || true
          echo '===== MODULE SESSION ====='
          javap -classpath xaero.jar -p -c xaero.hud.module.ModuleSession || true
          echo '===== HUD RENDERER ====='
          javap -classpath xaero.jar -p -c xaero.hud.render.HudRenderer > hudrenderer.txt
          grep -n -C 45 'isActive\|DISPLAY_MINIMAP\|getEffective\|render' hudrenderer.txt | head -n 1000 || true
          echo '===== MINIMAP EFFECT ====='
          javap -classpath xaero.jar -p -c xaero.common.effect.NoMinimapEffect || true
          javap -classpath xaero.jar -p -c xaero.common.effect.MinimapStatusEffect || true
