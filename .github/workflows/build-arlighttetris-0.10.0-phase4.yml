name: Build ArlightTetris 0.10.0 Phase 4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Download phase 4 source
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown 1zd9Y6EmgyK_fgfAHbmV_Bvs5QyIeh_m0 -O source.zip
          echo "a7beef9e89391469ff93b102805bdd9a839eda8b7200bda7b7b5e87444e4ce80  source.zip" | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project

      - name: Source audit
        run: |
          grep -q "version = '0.10.0'" project/build.gradle
          grep -q "drawPodiumCharacter" project/src/main/java/com/arlight/tetris/portraitfix/RankPanelRenderer.java
          grep -q "poseForRank" project/src/main/java/com/arlight/tetris/portraitfix/RankPanelRenderer.java
          grep -q "PUESTOS 4–8" project/src/main/java/com/arlight/tetris/portraitfix/RankPanelRenderer.java
          grep -q "TetrisGameMode.CHAOS, 8" project/src/main/java/com/arlight/tetris/network/NetworkSender.java
          ! grep -R "Items.PLAYER_HEAD\|DataComponents.PROFILE\|new ResolvableProfile" project/src/main/java

      - name: Compile ArlightTetris 0.10.0
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Validate JAR
        run: |
          JAR=$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          test -n "$JAR"
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'version = "0.10.0"'
          jar tf "$JAR" | grep -q 'com/arlight/tetris/portraitfix/RankPanelRenderer.class'
          javap -classpath "$JAR" -p com.arlight.tetris.portraitfix.RankPanelRenderer | grep -q 'drawPodiumCharacter'
          javap -classpath "$JAR" -p com.arlight.tetris.portraitfix.RankPanelRenderer | grep -q 'drawCompactRanking'
          ! jar tf "$JAR" | grep -q 'SkinImageRenderer.class'
          ! jar tf "$JAR" | grep -q 'ArlightTetrisPortraitFix.class'

      - name: Prepare delivery
        run: |
          mkdir -p delivery
          JAR=$(find project/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)
          cp "$JAR" delivery/ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS.jar
          cp source.zip delivery/ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS-SOURCE.zip
          cat > delivery/INSTALACION-0.10.0.txt <<'TXT'
          1. Apaga completamente el servidor y Minecraft.
          2. Elimina ArlightTetris 0.9.5 del servidor y de todos los clientes.
          3. Instala ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS.jar en servidor y clientes.
          4. Conserva ArlightCore 1.25.3; no necesita reemplazo.
          5. Inicia el servidor y ejecuta /tetris arena refresh dentro de tetris_arena.
          6. No reconstruyas la arena: la fase 4 cambia únicamente render y rankings.
          TXT
          sha256sum delivery/ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS.jar > delivery/SHA256.txt

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.10.0-PHASE4-PODIOS-VIVOS
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
