name: Build ArlightTetris 0.11.0 Competitive Flow + Core 1.25.4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Download coordinated sources
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown 1zd9Y6EmgyK_fgfAHbmV_Bvs5QyIeh_m0 -O tetris-source.zip
          gdown 1u3DCN0zxqQBAHDBWW6ISrqsBr4ufAKWD -O core-source.zip
          echo "70042d555fde9b48626c6f57f135978be341d3b5a46a19e5a6eaf2cd555979d3  tetris-source.zip" | sha256sum -c -
          echo "134279e2daa9ae94927b3c47b0e23fa16deee2ae1d8da4a5845c0a9dc9e8d16a  core-source.zip" | sha256sum -c -
          mkdir tetris core
          unzip -q tetris-source.zip -d tetris
          unzip -q core-source.zip -d core

      - name: Source audit
        shell: bash
        run: |
          grep -q "version = '0.11.0'" tetris/build.gradle
          grep -q 'versioned("12")' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          grep -q 'ClientPacketBridge::handleBoardState' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          grep -q 'ClientPacketBridge::handleSpectatorState' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          ! grep -q 'ClientPacketHandler::' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          test -f tetris/src/main/java/com/arlight/tetris/network/ClientboundSpectatorStatePacket.java
          grep -q 'ClientPacketBridge.install' tetris/src/main/java/com/arlight/tetris/client/ClientSetup.java
          grep -q 'value = Dist.CLIENT' tetris/src/main/java/com/arlight/tetris/client/ClientSetup.java
          grep -q 'spectatorNext' tetris/src/main/java/com/arlight/tetris/client/ClientGameState.java
          grep -q 'drawSpectatorExperience' tetris/src/main/java/com/arlight/tetris/client/TetrisOverlay.java
          grep -q 'getPpsHundredths' tetris/src/main/java/com/arlight/tetris/game/GameSession.java
          grep -q 'rankName' tetris/src/main/java/com/arlight/tetris/stats/TetrisPlayerStats.java
          grep -q 'onLobbyReset' tetris/src/main/java/com/arlight/tetris/server/ArenaMatchListener.java
          test -f tetris/src/main/resources/assets/arlighttetris/textures/item/tetris_core.png
          grep -q '<version>1.25.4</version>' core/pom.xml
          grep -q "version: '1.25.4'" core/src/main/resources/plugin.yml

      - name: Compile ArlightCore 1.25.4
        working-directory: core
        run: mvn -B -DskipTests clean package

      - name: Compile ArlightTetris 0.11.0
        working-directory: tetris
        run: gradle --no-daemon clean build

      - name: Validate compiled files
        shell: bash
        run: |
          CORE_JAR=$(find core/target -maxdepth 1 -type f -name 'ArlightCore-1.25.4.jar' | head -n 1)
          TETRIS_JAR=$(find tetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n 1)
          test -n "$CORE_JAR"
          test -n "$TETRIS_JAR"
          unzip -p "$CORE_JAR" plugin.yml | grep -q "version: '1.25.4'"
          unzip -p "$TETRIS_JAR" META-INF/neoforge.mods.toml | grep -q 'version = "0.11.0"'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/network/ClientPacketBridge.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/network/ClientboundSpectatorStatePacket.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/client/TetrisArcadeScreen.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/client/TetrisOverlay.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/stats/TetrisPlayerStats.class'
          javap -classpath "$TETRIS_JAR" -p -verbose com.arlight.tetris.network.NetworkSetup > networksetup.txt
          grep -q 'ClientPacketBridge' networksetup.txt
          ! grep -q 'ClientPacketHandler' networksetup.txt
          jar tf "$TETRIS_JAR" | grep -q 'assets/arlighttetris/textures/item/tetris_core.png'

      - name: Prepare coordinated delivery
        shell: bash
        run: |
          mkdir -p delivery
          CORE_JAR=$(find core/target -maxdepth 1 -type f -name 'ArlightCore-1.25.4.jar' | head -n 1)
          TETRIS_JAR=$(find tetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n 1)
          cp "$CORE_JAR" delivery/ArlightCore-1.25.4-TETRIS-ARCADE-ITEMS.jar
          cp "$TETRIS_JAR" delivery/ArlightTetris-0.11.0-COMPETITIVE-FLOW.jar
          cp core-source.zip delivery/ArlightCore-1.25.4-TETRIS-ARCADE-ITEMS-SOURCE.zip
          cp tetris-source.zip delivery/ArlightTetris-0.11.0-COMPETITIVE-FLOW-SOURCE.zip
          cp tetris/CAMBIOS_0.11.0.txt delivery/CAMBIOS_0.11.0.txt
          cat > delivery/INSTALACION-0.11.0.txt <<'TXT'
          ARLIGHTTETRIS 0.11.0 + ARLIGHTCORE 1.25.4

          1. Apaga completamente el servidor y cierra Minecraft en todos los clientes.
          2. Conserva ArlightCore 1.25.4; no necesita otra actualización.
          3. En mods/ del servidor y de todos los clientes elimina ArlightTetris 0.10.2.
          4. Instala ArlightTetris-0.11.0-COMPETITIVE-FLOW.jar.
          5. Todos los clientes deben usar exactamente la versión 0.11.0 porque el protocolo de red cambió a 12.
          6. No dejes dos versiones de ArlightTetris al mismo tiempo.
          7. Inicia primero el servidor y después los clientes.
          8. Prueba los objetos temáticos, /tetris interfaz y una partida con dos o más jugadores.
          9. No hace falta reconstruir la arena ni ejecutar /tetris arena refresh.
          TXT
          sha256sum delivery/*.jar > delivery/SHA256.txt

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.11.0-COMPETITIVE-FLOW-Core-1.25.4
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
