name: Build ArlightTetris 0.10.2 Server Dist Fix + Core 1.25.4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Download coordinated sources
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q gdown
          gdown 1zd9Y6EmgyK_fgfAHbmV_Bvs5QyIeh_m0 -O tetris-source.zip
          gdown 1u3DCN0zxqQBAHDBWW6ISrqsBr4ufAKWD -O core-source.zip
          echo "1c1fdf87a14b18907316ee0a016778648407f9fa71943ce7b75f0bf370c1b072  tetris-source.zip" | sha256sum -c -
          echo "134279e2daa9ae94927b3c47b0e23fa16deee2ae1d8da4a5845c0a9dc9e8d16a  core-source.zip" | sha256sum -c -
          mkdir tetris core
          unzip -q tetris-source.zip -d tetris
          unzip -q core-source.zip -d core

      - name: Source audit
        shell: bash
        run: |
          grep -q "version = '0.10.2'" tetris/build.gradle
          grep -q 'versioned("11")' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          grep -q 'ClientPacketBridge::handleBoardState' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          grep -q 'ClientPacketBridge::handleOpenArcadeMenu' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          ! grep -q 'ClientPacketHandler::' tetris/src/main/java/com/arlight/tetris/network/NetworkSetup.java
          grep -q 'class ClientPacketBridge' tetris/src/main/java/com/arlight/tetris/network/ClientPacketBridge.java
          grep -q 'ClientPacketBridge.install' tetris/src/main/java/com/arlight/tetris/client/ClientSetup.java
          grep -q 'value = Dist.CLIENT' tetris/src/main/java/com/arlight/tetris/client/ClientSetup.java
          grep -q 'class TetrisArcadeScreen' tetris/src/main/java/com/arlight/tetris/client/TetrisArcadeScreen.java
          test -f tetris/src/main/resources/assets/arlighttetris/textures/item/tetris_core.png
          test -f tetris/src/main/resources/assets/minecraft/models/item/nether_star.json
          grep -q '<version>1.25.4</version>' core/pom.xml
          grep -q "version: '1.25.4'" core/src/main/resources/plugin.yml
          grep -q 'openLobbyMenu' core/src/main/java/com/arlight/core/api/MinigameProvider.java
          grep -q 'TETRIS_MODEL_MAIN = 7100' core/src/main/java/com/arlight/core/items/CoreItems.java

      - name: Compile ArlightCore 1.25.4
        working-directory: core
        run: mvn -B -DskipTests clean package

      - name: Compile ArlightTetris 0.10.2
        working-directory: tetris
        run: gradle --no-daemon clean build

      - name: Validate compiled files
        shell: bash
        run: |
          CORE_JAR=$(find core/target -maxdepth 1 -type f -name 'ArlightCore-1.25.4.jar' | head -n 1)
          TETRIS_JAR=$(find tetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n 1)
          test -n "$CORE_JAR"
          test -n "$TETRIS_JAR"
          unzip -p "$CORE_JAR" plugin.yml | grep -q "version: '1.25.4'"
          unzip -p "$TETRIS_JAR" META-INF/neoforge.mods.toml | grep -q 'version = "0.10.2"'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/network/ClientPacketBridge.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/client/TetrisArcadeScreen.class'
          jar tf "$TETRIS_JAR" | grep -q 'com/arlight/tetris/network/ClientboundOpenArcadeMenuPacket.class'
          javap -classpath "$TETRIS_JAR" -p -c com.arlight.tetris.network.NetworkSetup > networksetup.txt
          grep -q 'ClientPacketBridge.handleBoardState' networksetup.txt
          grep -q 'ClientPacketBridge.handleOpenArcadeMenu' networksetup.txt
          ! grep -q 'ClientPacketHandler' networksetup.txt
          jar tf "$TETRIS_JAR" | grep -q 'assets/arlighttetris/textures/item/tetris_core.png'

      - name: Prepare coordinated delivery
        shell: bash
        run: |
          mkdir -p delivery
          CORE_JAR=$(find core/target -maxdepth 1 -type f -name 'ArlightCore-1.25.4.jar' | head -n 1)
          TETRIS_JAR=$(find tetris/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*javadoc*' | head -n 1)
          cp "$CORE_JAR" delivery/ArlightCore-1.25.4-TETRIS-ARCADE-ITEMS.jar
          cp "$TETRIS_JAR" delivery/ArlightTetris-0.10.2-INTERFAZ-ARCADE-SERVER-FIX.jar
          cp core-source.zip delivery/ArlightCore-1.25.4-TETRIS-ARCADE-ITEMS-SOURCE.zip
          cp tetris-source.zip delivery/ArlightTetris-0.10.2-INTERFAZ-ARCADE-SERVER-FIX-SOURCE.zip
          cat > delivery/INSTALACION-SERVER-DIST-FIX.txt <<'TXT'
          ARLIGHTTETRIS 0.10.2 + ARLIGHTCORE 1.25.4

          1. Apaga completamente el servidor y cierra Minecraft en todos los clientes.
          2. Conserva ArlightCore 1.25.4; no necesita otra actualización.
          3. En mods/ del servidor y de todos los clientes elimina ArlightTetris 0.10.1.
          4. Instala ArlightTetris-0.10.2-INTERFAZ-ARCADE-SERVER-FIX.jar.
          5. No dejes dos versiones de ArlightTetris al mismo tiempo.
          6. Inicia primero el servidor y confirma que completa el arranque.
          7. Después inicia los clientes y prueba /tetris interfaz.
          8. No hace falta reconstruir la arena ni ejecutar /tetris arena refresh.
          TXT
          sha256sum delivery/*.jar > delivery/SHA256.txt

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: ArlightTetris-0.10.2-SERVER-DIST-FIX-Core-1.25.4
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
